[global]
last_wallpaper = "5124"
queue_mode = "shuffle"
rotation_secs = 900
audio_fade_ms = 500
mute_when_other_audio = false
audio_capture_enabled = true
manual_muted = true
wallpaper_filter_json = '{"filters":[],"filter_logics":[]}'
wallpaper_sorts = []
wallpaper_skip_types = []
wallpaper_filter_tags = []
wallpaper_skip_content_ratings = []
plugin_update_notifications = true
duplicate_renderers_for_same_wallpaper = false
pointer_forwarding_enabled = true
autostart_enabled = true
hide_tray_icon = false

[global.renderer]
enable_audio = true
volume = 100

[global.layout]
fillmode = "preserve_aspect_crop"
align = "center"
rotation = "normal"

[global.layout.location]
x = 50
y = 50

[global.auto_replay]
any_window = "none"
focused = "mute"
maximized = "none"
fullscreen = "pause"
session_locked = "stop"
session_inactive = "stop"

[global.pause_effect]
kind = "none"

[global.pause_effect.blur]
radius = 30

[plugin.wescene-renderer]
