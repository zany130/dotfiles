autostart_enabled = true
hide_tray_icon = false
debug_logging_enabled = false

[global.renderer]
enable_audio = true
volume = 100

[global.layout]
fillmode = "preserve_aspect_crop"
align = "center"
rotation = "normal"

[global.layout.location]
x = 50
y = 50

[global.auto_replay]
any_window_scope = "current_display"
focused_scope = "all_displays"
maximized_scope = "current_display"
fullscreen_scope = "current_display"
any_window = "none"
focused = "mute"
maximized = "none"
fullscreen = "pause"
session_locked = "stop"
session_inactive = "stop"
resume_delay_ms = 250

[global.pause_effect]
kind = "none"

[global.pause_effect.blur]
radius = 30

[global.transition]
kind = "none"
duration_ms = 500
angle = 0

[global.transition.origin]
x = 50
y = 50

